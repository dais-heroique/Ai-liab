<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conforva — Décisions</title><link rel="icon" href="/static/conforva-mark.svg"><link rel="stylesheet" href="/static/console.css"><style>body{background:#080a0d;color:#eef0f2;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1180px;margin:0 auto;padding:42px 24px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:36px}.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.12em}.brand img{width:28px}.back{color:#aeb5bd;text-decoration:none}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.head h1{font-size:34px;letter-spacing:-.04em;margin:0 0 7px}.head p{margin:0;color:#858d97}.panel{border:1px solid #262c34;background:#0d1014;border-radius:14px;overflow:hidden}.toolbar{padding:14px 16px;border-bottom:1px solid #262c34;display:flex;gap:10px}.toolbar input,.toolbar select{background:#11151a;border:1px solid #303640;color:#eef0f2;border-radius:8px;padding:10px 12px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:15px 16px;border-bottom:1px solid #20252c;font-size:13px}.table th{font-size:10px;letter-spacing:.12em;color:#747d88}.table tr{cursor:pointer}.table tr:hover{background:#11151a}.muted{color:#7f8791}.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:700;letter-spacing:.06em}.block{background:#291416;color:#ffb0b0}.safe{background:#142319;color:#a9dfb7}.review{background:#292315;color:#e9c982}.empty{padding:50px;text-align:center;color:#747d88}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.card{width:min(760px,100%);max-height:90vh;overflow:auto;background:#0d1014;border:1px solid #303640;border-radius:16px;padding:28px}.close{float:right;background:none;border:0;color:#9da5ae;font-size:25px;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.field{border:1px solid #252b33;border-radius:10px;padding:14px;background:#101419}.field span{display:block;color:#737c87;font-size:10px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}.reason{border-top:1px solid #252b33;margin-top:20px;padding-top:20px;line-height:1.6}@media(max-width:700px){.head{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr}.table th:nth-child(3),.table td:nth-child(3){display:none}}</style></head><body><div class="wrap"><div class="top"><div class="brand"><img src="/static/conforva-mark.svg" alt="">CONFORVA</div><a class="back" href="/dashboard.html">← Retour au tableau de bord</a></div><div class="head"><div><h1>Décisions</h1><p>Chaque action évaluée par Conforva, avec son contexte et sa justification.</p></div><button onclick="load()">Actualiser</button></div><section class="panel"><div class="toolbar"><input id="filter" placeholder="Rechercher une action ou un agent…" oninput="render()"><select id="decisionFilter" onchange="render()"><option value="">Toutes les décisions</option><option value="BLOCK">Bloquées</option><option value="SAFE">Autorisées</option><option value="REVIEW">À vérifier</option></select></div><table class="table"><thead><tr><th>Action</th><th>Agent</th><th>Décision</th><th>Risque</th><th>Date</th></tr></thead><tbody id="rows"></tbody></table></section></div><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="card"><button class="close" onclick="closeModal()">×</button><div id="detail"></div></div></div><script>let decisions=[];const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const date=v=>v?new Date(v).toLocaleString('fr-FR',{dateStyle:'medium',timeStyle:'short'}):'—';async function load(){const r=await fetch('/v1/audit?limit=100',{credentials:'include'});if(r.status===401){location.href='/login';return}const d=await r.json();decisions=(Array.isArray(d)?d:(d.events||d.audit||[])).map(x=>({...x,decision:String(x.decision||'').toUpperCase()}));render()}function render(){const q=document.getElementById('filter').value.toLowerCase();const f=document.getElementById('decisionFilter').value;const rows=decisions.filter(x=>(!f||x.decision===f)&&(!q||JSON.stringify(x).toLowerCase().includes(q))).map((x,i)=>`<tr onclick="openDetail(${i})"><td><strong>${esc(x.action_type||'Action')}</strong><div class="muted">${esc(x.id||'')}</div></td><td>${esc(x.agent_id||'—')}</td><td><span class="badge ${x.decision.toLowerCase()}">${esc(x.decision||'—')}</span></td><td>${esc(x.risk_score??'—')}</td><td class="muted">${date(x.created_at||x.timestamp)}</td></tr>`).join('');document.getElementById('rows').innerHTML=rows||'<tr><td colspan="5" class="empty">Aucune décision enregistrée.</td></tr>'}function openDetail(i){const x=decisions.filter(y=>{const q=document.getElementById('filter').value.toLowerCase();const f=document.getElementById('decisionFilter').value;return(!f||y.decision===f)&&(!q||JSON.stringify(y).toLowerCase().includes(q))})[i];if(!x)return;document.getElementById('detail').innerHTML=`<span class="badge ${x.decision.toLowerCase()}">${esc(x.decision||'—')}</span><h2>${esc(x.action_type||'Action')}</h2><p class="muted">${esc(x.id||'Décision')} · ${date(x.created_at||x.timestamp)}</p><div class="grid"><div class="field"><span>Agent</span>${esc(x.agent_id||'—')}</div><div class="field"><span>Risque</span>${esc(x.risk_score??'—')} / 100</div><div class="field"><span>Montant</span>${x.amount==null?'—':esc(x.amount)+' €'}</div><div class="field"><span>Statut</span>${esc(x.decision||'—')}</div></div><div class="reason"><strong>Justification</strong><p>${esc(x.reason||x.summary||'Aucune justification enregistrée.')}</p></div><div class="reason"><strong>Contexte enregistré</strong><pre style="white-space:pre-wrap;color:#9da5ae">${esc(JSON.stringify(x,null,2))}</pre></div>`;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}load();</script></body></html>
