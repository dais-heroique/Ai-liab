<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Conforva — control plane for autonomous AI agents"><title>Conforva — Control Plane</title><link rel="icon" href="/static/conforva-mark.svg"><link rel="stylesheet" href="/static/console.css"></head><body><header class="topbar"><button class="brand" onclick="show('overview')"><img src="/static/conforva-mark.svg" alt=""><span>CONFORVA</span></button><div class="top-actions"><span class="operational"><i></i>Operational</span><button class="icon" onclick="load()" aria-label="Refresh">↻</button></div></header><div class="layout"><aside><div class="nav-title">CONTROL</div><button data-view="overview" onclick="show('overview')">Overview</button><button data-view="agents" onclick="show('agents')">Agents <b id="agentCount">0</b></button><button data-view="policies" onclick="show('policies')">Policies <b id="policyCount">0</b></button><button data-view="reviews" onclick="show('reviews')">Reviews <b id="reviewCount">0</b></button><div class="nav-title">EVIDENCE</div><button data-view="incidents" onclick="show('incidents')">Incidents</button><button data-view="audit" onclick="show('audit')">Audit</button><button data-view="sandbox" onclick="show('sandbox')">Sandbox</button></aside><main id="main"></main></div><dialog id="agentDialog"><form id="agentForm"><div class="dialog-head"><div><h2>Add agent</h2><p>Register an agent under Conforva control.</p></div><button type="button" class="icon" onclick="agentDialog.close()">×</button></div><label>Agent ID<input name="agent_id" placeholder="support-agent" required></label><label>Name<input name="name" placeholder="Customer Support Agent" required></label><div class="two"><label>Model<input name="model" value="gpt-4.1" required></label><label>Tier<select name="tier"><option>standard</option><option>trusted</option><option>critical</option></select></label></div><div class="two"><label>Autonomous limit (€)<input name="max_autonomous_amount" type="number" min="0" value="500"></label><label>Human review above (€)<input name="required_human_approval_above" type="number" min="0" value="500"></label></div><label>Human operator<input name="human_operator" placeholder="Operations team"></label><label>Purpose<textarea name="purpose" placeholder="What this agent is allowed to do"></textarea></label><div class="dialog-actions"><button type="button" class="secondary" onclick="agentDialog.close()">Cancel</button><button class="primary">Create agent</button></div><p id="agentError" class="error"></p></form></dialog><script src="/static/dashboard-core.js"></script></body></html>
