<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Conforva — protection et suivi des agents IA"><title>Conforva — Tableau de bord</title><link rel="icon" href="/static/conforva-mark.svg"><link rel="stylesheet" href="/static/console.css"></head><body><header class="topbar"><div class="top-left"><button id="menuButton" class="icon menu-button" type="button" aria-label="Ouvrir la navigation" aria-expanded="false" aria-controls="sidebar">☰</button><button class="brand" type="button" onclick="show('overview')" aria-label="Accueil"><img src="/static/conforva-mark.svg" alt=""><span>CONFORVA</span></button></div><div class="top-actions"><span id="orgName" class="operational"></span><button id="langButton" class="secondary lang-button" type="button" onclick="toggleLanguage()">EN</button><button class="icon" type="button" onclick="load()" aria-label="Actualiser">↻</button><button class="secondary" type="button" onclick="signOut" data-i18n="signOut">Se déconnecter</button></div></header><div class="layout"><aside id="sidebar"><div class="nav-title" data-i18n="control">PILOTAGE</div><button data-view="overview" data-i18n="overview">Vue d’ensemble</button><button data-view="agents"><span data-i18n="agents">Agents</span> <b id="agentCount">0</b></button><button data-view="policies"><span data-i18n="policies">Règles</span> <b id="policyCount">0</b></button><div class="nav-title" data-i18n="observe">SURVEILLANCE</div><button data-view="incidents"><span data-i18n="incidents">Incidents</span> <b id="incidentCount">0</b></button><button data-view="audit" data-i18n="audit">Historique</button><button data-view="sandbox" data-i18n="sandbox">Tester une action</button><div class="nav-title" data-i18n="account">COMPTE</div><button data-view="api" data-i18n="apiAccess">Accès API</button><button data-view="usage" data-i18n="usage">Utilisation</button><button type="button" onclick="startBilling()" data-i18n="billing">Abonnement</button></aside><main id="main"></main></div><dialog id="agentDialog"><form id="agentForm"><div class="dialog-head"><div><h2 data-i18n="addAgent">Ajouter un agent</h2><p data-i18n="addAgentSub">Ajoutez un agent et définissez ce qu’il peut faire.</p></div><button type="button" class="icon" onclick="agentDialog.close()" aria-label="Fermer">×</button></div><label data-i18n="agentId">Identifiant<input name="agent_id" placeholder="support-agent" required></label><label data-i18n="name">Nom<input name="name" placeholder="Agent service client" required></label><div class="two"><label data-i18n="model">Modèle<input value="MiniMax M3 · Vercel AI Gateway" disabled></label><label data-i18n="security">Protection<input value="Laguna S 2.1 · Vercel AI Gateway" disabled></label></div><div class="two"><label data-i18n="limit">Limite d’action (€)<input name="max_autonomous_amount" type="number" min="0" value="500"></label><label data-i18n="tier">Niveau<select name="tier"><option>standard</option><option>trusted</option><option>critical</option></select></label></div><label data-i18n="purpose">Rôle de l’agent<textarea name="purpose" placeholder="Ce que cet agent est autorisé à faire"></textarea></label><div class="dialog-actions"><button type="button" class="secondary" onclick="agentDialog.close()" data-i18n="cancel">Annuler</button><button class="primary" data-i18n="createAgent">Créer l’agent</button></div><p id="agentError" class="error"></p></form></dialog><script src="/static/dashboard-core.js"></script><script>document.querySelector('[onclick="signOut"]')?.addEventListener('click',signOut);async function startBilling(){try{const r=await api('/v1/billing');const b=r.billing;if(b?.stripe_customer_id){if(confirm(lang==='fr'?'Ouvrir la gestion de votre abonnement Stripe ?':'Open Stripe subscription management?')){const p=await api('/v1/billing/portal',{method:'POST'});location.href=p.url}return}const plan=prompt(lang==='fr'?'Choisissez une formule : starter, team ou enterprise':'Choose a plan: starter, team or enterprise','starter');if(!plan)return;const c=await api('/v1/billing/checkout',{method:'POST',body:JSON.stringify({plan:plan.toLowerCase()})});location.href=c.url}catch(e){alert(e.message)}}</script></body></html>
