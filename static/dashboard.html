<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Conforva — control plane for autonomous AI agents"><title>Conforva — Control Plane</title><link rel="icon" href="/static/conforva-mark.svg"><link rel="stylesheet" href="/static/console.css"></head><body><header class="topbar"><div class="top-left"><button id="menuButton" class="icon menu-button" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">☰</button><button class="brand" type="button" onclick="show('overview')" aria-label="Go to Overview"><img src="/static/conforva-mark.svg" alt=""><span>CONFORVA</span></button></div><div class="top-actions"><span class="operational"><i></i>Control plane operational</span><button class="icon" type="button" onclick="load()" aria-label="Refresh">↻</button></div></header><div class="layout"><aside id="sidebar"><div class="nav-title">CONTROL</div><button data-view="overview">Overview</button><button data-view="agents">Agents <b id="agentCount">0</b></button><button data-view="policies">Policies <b id="policyCount">0</b></button><div class="nav-title">OBSERVE</div><button data-view="incidents">Incidents <b id="incidentCount">0</b></button><button data-view="audit">Audit</button><button data-view="sandbox">Sandbox</button></aside><main id="main"></main></div><dialog id="agentDialog"><form id="agentForm"><div class="dialog-head"><div><h2>Add agent</h2><p>Create an autonomous production agent. Every action is evaluated by deterministic controls and the security model.</p></div><button type="button" class="icon" onclick="agentDialog.close()" aria-label="Close">×</button></div><label>Agent ID<input name="agent_id" placeholder="support-agent" required></label><label>Name<input name="name" placeholder="Customer Support Agent" required></label><div class="two"><label>Execution model<input value="MiniMax M3 · Vercel AI Gateway" disabled></label><label>Security layer<input value="Poolside Laguna S 2.1 · Vercel AI Gateway" disabled></label></div><div class="two"><label>Autonomous limit (€)<input name="max_autonomous_amount" type="number" min="0" value="500"></label><label>Tier<select name="tier"><option>standard</option><option>trusted</option><option>critical</option></select></label></div><label>Purpose<textarea name="purpose" placeholder="What this agent is allowed to do"></textarea></label><div class="dialog-actions"><button type="button" class="secondary" onclick="agentDialog.close()">Cancel</button><button class="primary">Create agent</button></div><p id="agentError" class="error"></p></form></dialog><script src="/static/dashboard-core.js"></script></body></html>
