<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#080a0d"><title>Conforva — Connexion</title><meta name="description" content="Connexion et création de compte Conforva."><link rel="canonical" href="https://conforva.com/login"><link rel="icon" href="/static/conforva-mark.svg"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080a0d;color:#eef0f2;font:14px Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;display:grid;place-items:center}main{width:min(430px,calc(100% - 32px));padding:28px}header{text-align:center;margin-bottom:30px}header img{width:34px;margin-bottom:16px}header strong{display:block;font-size:12px;letter-spacing:.18em}header p{color:#747b84;font-size:12px;margin:10px 0 0}.panel{border:1px solid #252a31;background:#0d1014;border-radius:12px;padding:24px}h1{font-size:21px;letter-spacing:-.03em;margin:0 0 6px}#subtitle{color:#747b84;font-size:12px;margin:0 0 22px}label{display:block;color:#969da7;font-size:11px;margin:13px 0}input{width:100%;margin-top:6px;padding:11px 12px;border:1px solid #2a3038;border-radius:7px;background:#11151a;color:#eef0f2;outline:none}input:focus{border-color:#717985;box-shadow:0 0 0 2px #71798522}.primary{width:100%;margin-top:10px;padding:11px;border:1px solid #d9dde2;border-radius:7px;background:#e8eaed;color:#080a0d;font-weight:700;cursor:pointer}.switch{width:100%;margin-top:14px;border:0;background:none;color:#969da7;cursor:pointer;font-size:11px}.error{min-height:17px;color:#df8585;font-size:11px;margin:12px 0 0}.fine{color:#565d67;font-size:10px;line-height:1.5;text-align:center;margin-top:18px}a{color:#aebcff}</style></head><body><main><header><img src="/static/conforva-mark.svg" alt="Logo Conforva"><strong>CONFORVA</strong><p>Protection et gouvernance pour les agents IA</p></header><section class="panel"><h1 id="title">Bon retour</h1><p id="subtitle">Connectez-vous à votre espace Conforva.</p><form id="form"><div id="nameWrap" hidden><label>Votre nom<input name="name" autocomplete="name"></label></div><div id="companyWrap" hidden><label>Entreprise<input name="company" autocomplete="organization"></label></div><label>Email professionnel<input name="email" type="email" autocomplete="email" required></label><label>Mot de passe<input name="password" type="password" minlength="8" autocomplete="current-password" required></label><button class="primary" id="submit" type="submit">Se connecter</button><button class="switch" id="switch" type="button">Créer un compte</button><p class="error" id="error" role="alert" aria-live="polite"></p></form></section><p class="fine">Votre espace et vos données restent isolés de ceux des autres organisations. <a href="/privacy">Confidentialité</a> · <a href="/terms">Conditions</a></p></main><script>
(() => {
  const params = new URLSearchParams(location.search);
  let signup = params.get('mode') === 'signup';
  const PLAN_NAMES = { starter: 'Starter', growth: 'Growth', pro: 'Pro' };
  const planKey = (params.get('plan') || '').toLowerCase();
  const plan = PLAN_NAMES[planKey] ? planKey : null;
  const $ = (id) => document.getElementById(id);
  const form = $('form'), submit = $('submit'), error = $('error');
  const MESSAGES = {
    invalid_credentials: 'Email ou mot de passe incorrect.',
    email_already_registered: 'Un compte existe déjà avec cet email.',
    password_too_short: 'Le mot de passe doit contenir au moins 8 caractères.',
    database_unavailable: 'Le service est momentanément indisponible. Réessayez dans un instant.',
    stripe_not_configured: 'Le paiement n’est pas encore configuré.',
    stripe_price_not_configured: 'Cette formule n’est pas encore disponible.',
    invalid_plan: 'Formule inconnue.',
    'name,email,password,and company_are_required': 'Merci de remplir votre nom, votre entreprise, votre email et un mot de passe.',
    email_password_required: 'Email et mot de passe requis.',
    checkout_failed: 'Impossible de démarrer le paiement.',
    network: 'Connexion impossible. Vérifiez votre réseau et réessayez.',
  };
  const message = (code) => MESSAGES[String(code).split(':')[0]] || 'Une erreur est survenue. Réessayez.';

  function render() {
    const planName = plan ? PLAN_NAMES[plan] : '';
    $('title').textContent = signup ? 'Créer votre espace' : 'Bon retour';
    $('subtitle').textContent = signup
      ? (plan ? `Créez votre compte pour démarrer la formule ${planName} (14 jours gratuits).` : 'Configurez votre organisation en quelques instants.')
      : (plan ? `Connectez-vous pour continuer avec la formule ${planName}.` : 'Connectez-vous à votre espace Conforva.');
    submit.textContent = signup ? 'Créer le compte' : 'Se connecter';
    $('switch').textContent = signup ? 'Déjà un compte ? Se connecter' : 'Créer un compte';
    $('nameWrap').hidden = !signup;
    $('companyWrap').hidden = !signup;
    form.querySelector('[name=name]').required = signup;
    form.querySelector('[name=company]').required = signup;
    form.querySelector('[name=password]').autocomplete = signup ? 'new-password' : 'current-password';
    error.textContent = '';
  }

  async function postJSON(url, body) {
    let r;
    try {
      r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify(body) });
    } catch { throw new Error('network'); }
    let data = {};
    try { data = await r.json(); } catch { /* non-JSON response */ }
    return { ok: r.ok, status: r.status, data };
  }

  async function goToCheckoutOrDashboard() {
    if (!plan) return location.replace('/dashboard#overview');
    const c = await postJSON('/v1/billing/checkout', { plan });
    if (c.ok && c.data.url) return (location.href = c.data.url);
    if (c.status === 409) return location.replace('/dashboard#billing');
    throw new Error(c.data.error || 'checkout_failed');
  }

  $('switch').addEventListener('click', () => { signup = !signup; render(); });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (submit.disabled) return;
    error.textContent = '';
    const label = submit.textContent;
    submit.disabled = true;
    submit.textContent = signup ? 'Création…' : 'Connexion…';
    try {
      const data = Object.fromEntries(new FormData(form));
      if (!signup) { delete data.name; delete data.company; }
      const r = await postJSON(signup ? '/v1/auth/signup' : '/v1/auth/login', data);
      if (!r.ok) throw new Error(r.data.error || 'authentication_failed');
      await goToCheckoutOrDashboard();
    } catch (x) {
      error.textContent = message(x.message);
      submit.disabled = false;
      submit.textContent = label;
    }
  });

  fetch('/v1/auth/me', { credentials: 'include' })
    .then((r) => { if (r.ok) return goToCheckoutOrDashboard(); })
    .catch(() => {});

  render();
})();
</script></body></html>
