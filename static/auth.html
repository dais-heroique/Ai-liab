<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Conforva — Connexion</title><link rel="icon" href="/static/conforva-mark.svg"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080a0d;color:#eef0f2;font:14px Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;display:grid;place-items:center}main{width:min(430px,calc(100% - 32px));padding:28px}header{text-align:center;margin-bottom:30px}header img{width:34px;margin-bottom:16px}header strong{display:block;font-size:12px;letter-spacing:.18em}header p{color:#747b84;font-size:12px;margin:10px 0 0}.panel{border:1px solid #252a31;background:#0d1014;border-radius:12px;padding:24px}h1{font-size:21px;letter-spacing:-.03em;margin:0 0 6px}#subtitle{color:#747b84;font-size:12px;margin:0 0 22px}label{display:block;color:#969da7;font-size:11px;margin:13px 0}input{width:100%;margin-top:6px;padding:11px 12px;border:1px solid #2a3038;border-radius:7px;background:#11151a;color:#eef0f2;outline:none}input:focus{border-color:#717985;box-shadow:0 0 0 2px #71798522}.primary{width:100%;margin-top:10px;padding:11px;border:1px solid #d9dde2;border-radius:7px;background:#e8eaed;color:#080a0d;font-weight:700;cursor:pointer}.switch{width:100%;margin-top:14px;border:0;background:none;color:#969da7;cursor:pointer;font-size:11px}.error{min-height:17px;color:#df8585;font-size:11px;margin:12px 0 0}.fine{color:#565d67;font-size:10px;line-height:1.5;text-align:center;margin-top:18px}</style></head><body><main><header><img src="/static/conforva-mark.svg" alt=""><strong>CONFORVA</strong><p>Protection et gouvernance pour les agents IA</p></header><section class="panel"><h1 id="title">Bon retour</h1><p id="subtitle">Connectez-vous à votre espace Conforva.</p><form id="form"><div id="nameWrap" hidden><label>Votre nom<input name="name" autocomplete="name"></label></div><div id="companyWrap" hidden><label>Entreprise<input name="company" autocomplete="organization"></label></div><label>Email professionnel<input name="email" type="email" autocomplete="email" required></label><label>Mot de passe<input name="password" type="password" minlength="8" autocomplete="current-password" required></label><button class="primary" id="submit">Se connecter</button><button class="switch" id="switch" type="button">Créer un compte</button><p class="error" id="error"></p></form></section><p class="fine">Votre espace et vos données restent isolés de ceux des autres organisations.</p></main><script>if(location.pathname==='/'&&!location.search){location.replace('/landing')}else{let signup=new URLSearchParams(location.search).get('mode')==='signup';const plan=new URLSearchParams(location.search).get('plan');const $=id=>document.getElementById(id);function render(){if(signup){$('title').textContent='Créer votre espace';$('subtitle').textContent=plan?`Créez votre compte pour choisir la formule ${plan}.`:'Configurez votre organisation en quelques instants';$('submit').textContent='Créer le compte';$('switch').textContent='Déjà un compte ? Se connecter';$('nameWrap').hidden=false;$('companyWrap').hidden=false;$('form').querySelector('[name=password]').autocomplete='new-password'}else{$('title').textContent='Bon retour';$('subtitle').textContent=plan?`Connectez-vous pour continuer avec la formule ${plan}.`:'Connectez-vous à votre espace Conforva.';$('submit').textContent='Se connecter';$('switch').textContent='Créer un compte';$('nameWrap').hidden=true;$('companyWrap').hidden=true;$('form').querySelector('[name=password]').autocomplete='current-password'}$('error').textContent=''}$('switch').onclick=()=>{signup=!signup;render()};$('form').onsubmit=async e=>{e.preventDefault();$('error').textContent='';const data=Object.fromEntries(new FormData(e.currentTarget));try{const r=await fetch(signup?'/v1/auth/signup':'/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw new Error(j.error||'authentication_failed');if(plan){const c=await fetch('/v1/billing/checkout',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({plan})});const checkout=await c.json();if(!c.ok)throw new Error(checkout.error||'checkout_failed');location.href=checkout.url}else location.replace('/dashboard#overview')}catch(x){$('error').textContent=({invalid_credentials:'Email ou mot de passe incorrect.',email_already_registered:'Un compte existe déjà avec cet email.',password_too_short:'Le mot de passe doit contenir au moins 8 caractères.',database_unavailable:'Le service de données n’est pas configuré.',stripe_not_configured:'Le paiement n’est pas encore configuré.',stripe_price_not_configured:'Cette formule n’est pas encore disponible.',checkout_failed:'Impossible de démarrer le paiement.'}[x.message]||x.message)}};fetch('/v1/auth/me',{credentials:'include'}).then(r=>{if(r.ok){if(plan)fetch('/v1/billing/checkout',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({plan})}).then(x=>x.json()).then(x=>x.url?location.href=x.url:location.replace('/dashboard#overview'));else location.replace('/dashboard#overview')}});render()}</script></body></html>
