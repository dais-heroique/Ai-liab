<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Arexid — Sign in</title><link rel="icon" href="/static/arexid-mark.svg"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080a0d;color:#eef0f2;font:14px Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;display:grid;place-items:center}main{width:min(430px,calc(100% - 32px));padding:28px}header{text-align:center;margin-bottom:30px}header img{width:34px;margin-bottom:16px}header strong{display:block;font-size:12px;letter-spacing:.18em}header p{color:#747b84;font-size:12px;margin:10px 0 0}.panel{border:1px solid #252a31;background:#0d1014;border-radius:12px;padding:24px}h1{font-size:21px;letter-spacing:-.03em;margin:0 0 6px}#subtitle{color:#747b84;font-size:12px;margin:0 0 22px}label{display:block;color:#969da7;font-size:11px;margin:13px 0}input{width:100%;margin-top:6px;padding:11px 12px;border:1px solid #2a3038;border-radius:7px;background:#11151a;color:#eef0f2;outline:none}input:focus{border-color:#717985;box-shadow:0 0 0 2px #71798522}.primary{width:100%;margin-top:10px;padding:11px;border:1px solid #d9dde2;border-radius:7px;background:#e8eaed;color:#080a0d;font-weight:700;cursor:pointer}.switch{width:100%;margin-top:14px;border:0;background:none;color:#969da7;cursor:pointer;font-size:11px}.error{min-height:17px;color:#df8585;font-size:11px;margin:12px 0 0}.fine{color:#565d67;font-size:10px;line-height:1.5;text-align:center;margin-top:18px}</style></head><body><main><header><img src="/static/arexid-mark.svg" alt=""><strong>AREXID</strong><p>Control infrastructure for autonomous AI</p></header><section class="panel"><h1 id="title">Welcome back</h1><p id="subtitle">Sign in to your control plane.</p><form id="form"><div id="nameWrap" hidden><label>Your name<input name="name" autocomplete="name"></label></div><div id="companyWrap" hidden><label>Company<input name="company" autocomplete="organization"></label></div><label>Work email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" minlength="8" autocomplete="current-password" required></label><button class="primary" id="submit">Sign in</button><button class="switch" id="switch" type="button">Create an account</button><p class="error" id="error"></p></form></section><p class="fine">Your control-plane data is isolated to your organization and persisted in Turso.</p></main><script>let signup=false;const $=id=>document.getElementById(id);function render(){signup?($('title').textContent='Create your workspace',$('subtitle').textContent='Set up your organization in under a minute',$('submit').textContent='Create account',$('switch').textContent='Already have an account? Sign in',$('nameWrap').hidden=false,$('companyWrap').hidden=false,$('form').querySelector('[name=password]').autocomplete='new-password'):($('title').textContent='Welcome back',$('subtitle').textContent='Sign in to your control plane.',$('submit').textContent='Sign in',$('switch').textContent='Create an account',$('nameWrap').hidden=true,$('companyWrap').hidden=true,$('form').querySelector('[name=password]').autocomplete='current-password');$('error').textContent=''}$('switch').onclick=()=>{signup=!signup;render()};$('form').onsubmit=async e=>{e.preventDefault();$('error').textContent='';const data=Object.fromEntries(new FormData(e.currentTarget));try{const r=await fetch(signup?'/v1/auth/signup':'/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Authentication failed');location.replace('/dashboard#overview')}catch(x){$('error').textContent=({invalid_credentials:'Email or password is incorrect.',email_already_registered:'An account already exists for this email.',password_too_short:'Password must contain at least 8 characters.',database_unavailable:'Database is not configured.'}[x.message]||x.message)}};fetch('/v1/auth/me',{credentials:'include'}).then(r=>{if(r.ok)location.replace('/dashboard#overview')});render();</script></body></html>
