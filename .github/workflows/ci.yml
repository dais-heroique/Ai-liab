name: Conforva CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: TypeScript build
        run: npm run build
      - name: Check browser scripts
        run: |
          node --check static/dashboard-core.js
          node --check static/enterprise-ux.js
          node --check static/conforva-brand.js
          node --check static/conforva-premium.js
